name: Compilar Braga Eventos Agenda 15
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Instalar MAUI Android
        run: dotnet workload install maui-android
      - name: Compilar APK
        run: dotnet publish BragaEventos.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false
      - uses: actions/upload-artifact@v4
        with:
          name: BragaEventos-Agenda15-APK
          path: '**/bin/Release/net10.0-android/**/*.apk'
